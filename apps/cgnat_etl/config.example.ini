[proceso]
# Sin --fecha se consulta ayer en America/Lima, desde Python o shell.
source_database = cgnat
source_table_prefix = huawei_cgn_nat_v2_
public_ip = 179.6.75.138
batch_size = 10000
max_threads = 2
max_execution_time = 3600
connect_timeout = 15
send_receive_timeout = 3900

[destino]
host = 172.19.242.107
port = 8123
# El ejemplo entregado conecta a este servidor con el usuario nifi.
username = nifi
# Base inicial de la conexion del ejemplo que ya funciona. Las tablas del ETL
# se crean y usan como elog.tabla de forma explicita.
database = ookla
# Elegir UNA opcion para la clave:
# password = escribir_clave_aqui
password_env = CGNAT_DEST_PASSWORD
secure = false
verify = true

# Son cuatro origenes independientes. No usar una tabla Distributed ni repetir replicas.
# Todos usan HTTP (normalmente 8123) o HTTPS, NO el puerto nativo 9000.
[origen_1]
host = 10.96.167.132
port = 8123
username = CAMBIAR_USUARIO_ORIGEN
# database es opcional; por defecto se usa default.
# password = escribir_clave_aqui
password_env = CGNAT_SOURCE_PASSWORD
secure = false
verify = true

