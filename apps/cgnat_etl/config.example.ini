[proceso]
# Sin --fecha se consulta ayer en America/Lima, desde Python o shell.
source_database = cgnat
source_table_prefix = huawei_cgn_nat_v2_
public_ip = 179.6.75.138
batch_size = 10000
max_threads = 2
max_execution_time = 3600
connect_timeout = 15
send_receive_timeout = 3900

[destino]
host = 172.19.242.107
port = 8123
username = CAMBIAR_USUARIO_DESTINO
password_env = CGNAT_DEST_PASSWORD
secure = false
verify = true

# Son cuatro origenes independientes. No usar una tabla Distributed ni repetir replicas.
# Todos usan HTTP (normalmente 8123) o HTTPS, NO el puerto nativo 9000.
